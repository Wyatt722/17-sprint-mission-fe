<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>panda login</title>
    <link rel="stylesheet" href="../login/index.css" />
  </head>
  <body class="container">
    <div class="box">
      <header class="icon-box">
        <img src="../images/panda_face.png" alt="판다마켓 로고" class="icon" />

        <div class="icon-text">판다마켓</div>
      </header>

      <main class="main-box">
        <div class="email-box">
          <label class="email-text">이메일</label>
          <input
            type="email"
            id="user-email"
            placeholder="이메일을 입력해주세요"
            class="email-input"
            required
          />
        </div>

        <div class="password-box">
          <label class="password-text">비밀번호</label>
          <input
            type="password"
            id="user-password"
            placeholder="비밀번호를 입력해주세요"
            class="password-input"
            required
          />
        </div>

        <a href="" class="login-box">로그인</a>

        <div class="simple-login-box">
          <p class="simple-login-text">간편 로그인하기</p>
          <div class="simple-login-logo">
            <a href="https://www.google.com/" class="google-logo">
              <img
                src="../images/login-img/Component 2.png"
                alt="구글 로고 이미지"
                class="google-logo-img"
              />
            </a>
            <a href="https://www.kakaocorp.com/page/" class="kakao-logo">
              <img
                src="../images/login-img/Component 3.png"
                alt="카카오 로고 이미지"
                class="kakao-logo-img"
              />
            </a>
          </div>
        </div>

        <div class="panda-first">
          <p class="panda-first-text">판다마켓이 처음이신가요?</p>
          <a href="../signup/index.html" class="panda-first-signup">
            회원가입
          </a>
        </div>
      </main>
    </div>
  </body>
</html>
